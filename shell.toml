[lock]
background = "#10262B"
background-alpha = 1.0
text = "#E4DBBF"
placeholder = "#A7AB99"
text-error = "#D5A397"
border = "#3D5958"
border-active = "#DCCDAA"
border-error = "#D5A397"
border-alpha = 1.0
selection = "#DCCDAA"
